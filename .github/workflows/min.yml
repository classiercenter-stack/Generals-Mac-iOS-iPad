name: Build iOS

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: macos-latest
timeout-minutes: 360


steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install tools
    run: |
      brew install cmake ninja meson pkgconf xcodegen
      git submodule update --init references/fbraz3-dxvk

  - name: Prepare iOS
    run: |
      ./scripts/build/ios/fetch-moltenvk.sh
      ./scripts/build/ios/stage-fonts.sh

  - name: Configure
    run: cmake --preset ios-vulkan

  - name: Build
    run: cmake --build build/ios-vulkan --target z_generals --parallel 3
